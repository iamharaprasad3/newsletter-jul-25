  <script type="text/javascript" id="gwd-init-code">
    (function() {
      var gwdAd = document.getElementById('gwd-ad');

      /**
       * Handles the DOMContentLoaded event. The DOMContentLoaded event is
       * fired when the document has been completely loaded and parsed.
       */
      function handleDomContentLoaded(event) {

      }

      /**
       * Handles the WebComponentsReady event. This event is fired when all
       * custom elements have been registered and upgraded.
       */
      function handleWebComponentsReady(event) {
        // Start the Ad lifecycle.
        requestAnimationFrame(function() {
          setTimeout(function() {
            gwdAd.initAd();
          }, 1);
        });
      }

      /**
       * Handles the event that is dispatched after the Ad has been
       * initialized and before the default page of the Ad is shown.
       */
      function handleAdInitialized(event) {}

      window.addEventListener('DOMContentLoaded',
        handleDomContentLoaded, false);
      window.addEventListener('WebComponentsReady',
        handleWebComponentsReady, false);
      window.addEventListener('adinitialized',
        handleAdInitialized, false);
    })();
  </script>
  <script type="text/javascript" id="responsive-fit">
    (function() {
      // Design size of every gwd-page (data-gwd-width / data-gwd-height).
      var PAGE_WIDTH = 585;
      var PAGE_HEIGHT = 809;
      // Space kept above and below the page when the screen height is the limit.
      var VERTICAL_MARGIN = 24;

      /**
       * Scales the page deck so a whole page fits inside the viewport,
       * shrinking on small screens and never enlarging past 100%.
       */
      function fitToViewport() {
        var deck = document.getElementById('pagedeck');
        if (!deck) return;
        var vw = window.innerWidth || document.documentElement.clientWidth;
        var vh = window.innerHeight || document.documentElement.clientHeight;
        var scale = Math.min(vw / PAGE_WIDTH,
          (vh - 2 * VERTICAL_MARGIN) / PAGE_HEIGHT, 1);
        deck.style.transform = 'scale(' + scale + ')';
      }

      fitToViewport();
      window.addEventListener('DOMContentLoaded', fitToViewport, false);
      window.addEventListener('load', fitToViewport, false);
      window.addEventListener('resize', fitToViewport, false);
      window.addEventListener('orientationchange', fitToViewport, false);
    })();
  </script>
